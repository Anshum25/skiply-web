<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Basic Meta Tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3B82F6" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Skiply Technologies" />
    <meta name="keywords" content="Skiply, smart queue, booking platform, virtual queue, appointment scheduling, queue management, business booking app, Skiply India" />

    <!-- Title & Description -->
    <title>Skiply — Smart Real-Time Queue Booking Platform</title>
    <meta
      name="description"
      content="Skiply is a smart real-time queue booking platform that helps users skip waiting lines and businesses manage queues efficiently with live tracking, scheduling, and instant updates."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="Skiply — Smart Real-Time Queue Booking Platform" />
    <meta property="og:description" content="Skiply helps you skip the queue! Real-time booking and queue management for users and businesses across India." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://skiply.in" />
    <meta property="og:image" content="%PUBLIC_URL%/banner.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Skiply — Book Your Spot, Skip the Wait" />
    <meta name="twitter:description" content="Join Skiply and experience hassle-free, smart queue booking for clinics, salons, and businesses." />
    <meta name="twitter:image" content="%PUBLIC_URL%/banner.png" />

    <!-- Favicon & App Icons -->
    <link rel="icon" href="%PUBLIC_URL%/logo.jpeg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data for SEO (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Skiply",
        "url": "https://skiply.in",
        "logo": "%PUBLIC_URL%/logo.jpeg",
        "sameAs": [
          "https://www.linkedin.com/company/skiply",
          "https://twitter.com/skiplyapp"
        ],
        "description": "Skiply is a smart real-time queue booking platform helping users and businesses manage appointments efficiently.",
        "foundingDate": "2025",
        "founder": {
          "@type": "Person",
          "name": "Anshum Dev"
        }
      }
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run Skiply.</noscript>
    <div id="root"></div>
  </body>
</html>
